[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prooftag-qr"
version = "0.1.0"
description = "Generation, validation and observability pipeline for aesthetic Prooftag QR codes"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.35,<2",
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
  "pillow>=10.4,<12",
  "prometheus-client>=0.21,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "pyzbar>=0.1.9,<1",
  "qrcode[pil]>=8,<9",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
gpu = [
  # Compatibility set for pytorch/pytorch:2.4.1-cuda12.1-cudnn9-runtime.
  # Upgrade these versions together with the PyTorch base image.
  "accelerate==0.34.2",
  "diffusers==0.31.0",
  "huggingface-hub==0.25.2",
  "safetensors==0.4.5",
  "transformers==4.44.2",
]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "pyyaml>=6,<7",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
include = ["prooftag_qr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
