[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prooftag-qr"
version = "0.1.0"
description = "Generation, validation and observability pipeline for aesthetic Prooftag QR codes"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.35,<2",
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "numpy>=1.26,<3",
  "opencv-contrib-python-headless>=4.10,<5",
  "pillow>=10.4,<12",
  "prometheus-client>=0.21,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "pyzbar>=0.1.9,<1",
  "qrcode[pil]>=8,<9",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
  "zxing-cpp>=3.0,<4",
]

[project.optional-dependencies]
gpu = [
  # Public DiffQRCoder compatibility set (pinned upstream revision in Dockerfile).
  "accelerate==1.3.0",
  "diffusers==0.32.2",
  "lpips==0.1.4",
  "safetensors==0.5.2",
  "tqdm==4.67.1",
  "transformers==4.48.3",
  "torchvision==0.21.0",
]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "pyyaml>=6,<7",
  "ruff>=0.8,<1",
]
notebook = [
  "jupyterlab>=4.2,<5",
  "kornia>=0.8,<1",
  "matplotlib>=3.9,<4",
  "pandas>=2.2,<3",
  # Required by the T5 tokenizer embedded in FLUX pipelines.
  "protobuf==5.29.3",
  "sentencepiece==0.2.0",
]
optimizer = [
  "catboost>=1.2.8,<2",
  "joblib>=1.4,<2",
  "optuna>=4.4,<5",
  "scikit-learn>=1.5,<2",
]
quality = [
  # PyPI 1.2.0 omits bpe_simple_vocab_16e6.txt.gz. The pinned official
  # source revision includes it through package_data.
  "hpsv2 @ git+https://github.com/tgxs002/HPSv2.git@866735ecaae999fa714bd9edfa05aa2672669ee3",
]

[tool.setuptools.packages.find]
include = ["prooftag_qr*"]

[tool.setuptools.package-data]
prooftag_qr = ["lab_static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
