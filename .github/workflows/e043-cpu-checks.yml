name: E043 CPU checks
on:
  push:
    paths:
      - 'prooftag_qr/e043_scanner_cell_frontier.py'
      - 'scripts/*e043*'
      - 'deploy/k8s/e043-*'
      - 'notebooks/41_e043_*'
      - 'notebooks/42_e043_*'
      - 'tests/test_e043_*'
  pull_request:
    paths:
      - 'prooftag_qr/e043_scanner_cell_frontier.py'
      - 'scripts/*e043*'
      - 'deploy/k8s/e043-*'
      - 'notebooks/41_e043_*'
      - 'notebooks/42_e043_*'
      - 'tests/test_e043_*'
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest pyyaml
      - run: python scripts/build_e043_scanner_cell_notebook.py
      - run: python scripts/build_e043_final_pipeline_notebook.py
      - run: python -m py_compile prooftag_qr/e043_scanner_cell_frontier.py scripts/build_e043_scanner_cell_notebook.py scripts/build_e043_final_pipeline_notebook.py
      - run: bash -n scripts/run-e043-scanner-cell-frontier.sh scripts/deploy-e043-notebooks.sh scripts/download-e043-results.sh
      - run: python -c "import yaml; yaml.safe_load(open('deploy/k8s/e043-scanner-cell-frontier-job.yaml',encoding='utf-8'))"
      - run: pytest -q tests/test_e043_contract.py tests/test_e043_deployment.py tests/test_e043_notebooks.py
