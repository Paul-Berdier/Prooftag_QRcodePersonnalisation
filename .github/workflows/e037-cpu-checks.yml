name: E037 CPU checks

on:
  push:
    paths:
      - "prooftag_qr/e037_holdout.py"
      - "scripts/build_e037_prospective_global_trust_holdout_notebook.py"
      - "notebooks/32_e037_prospective_global_trust_holdout.ipynb"
      - "scripts/deploy-e037-notebook.sh"
      - "scripts/run-e037-holdout.sh"
      - "scripts/e037-remote.ps1"
      - "deploy/k8s/e037-holdout-job.yaml"
      - "tests/test_e037_*.py"
  pull_request:
    paths:
      - "prooftag_qr/e037_holdout.py"
      - "scripts/build_e037_prospective_global_trust_holdout_notebook.py"
      - "notebooks/32_e037_prospective_global_trust_holdout.ipynb"
      - "scripts/deploy-e037-notebook.sh"
      - "scripts/run-e037-holdout.sh"
      - "scripts/e037-remote.ps1"
      - "deploy/k8s/e037-holdout-job.yaml"
      - "tests/test_e037_*.py"

jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[notebook,optimizer]'
      - run: pytest -q tests/test_e037_holdout.py tests/test_e037_notebook.py tests/test_e037_deployment.py
