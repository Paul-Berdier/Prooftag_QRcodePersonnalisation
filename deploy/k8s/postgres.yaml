apiVersion: v1
kind: Service
metadata:
  name: prooftag-qr-postgres
  namespace: qr-core
  labels:
    app: prooftag-qr-postgres
spec:
  selector:
    app: prooftag-qr-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prooftag-qr-postgres
  namespace: qr-core
  labels:
    app: prooftag-qr-postgres
    app.kubernetes.io/part-of: prooftag-qr
spec:
  serviceName: prooftag-qr-postgres
  replicas: 1
  selector:
    matchLabels:
      app: prooftag-qr-postgres
  template:
    metadata:
      labels:
        app: prooftag-qr-postgres
        app.kubernetes.io/part-of: prooftag-qr
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: prooftag_qr
            - name: POSTGRES_USER
              value: prooftag_qr
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: prooftag-qr-database
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            exec:
              command: [pg_isready, -U, prooftag_qr, -d, prooftag_qr]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: [pg_isready, -U, prooftag_qr, -d, prooftag_qr]
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: database
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: database
        labels:
          app: prooftag-qr-postgres
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path-retain
        resources:
          requests:
            storage: 20Gi
