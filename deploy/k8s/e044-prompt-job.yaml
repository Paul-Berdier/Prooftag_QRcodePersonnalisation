apiVersion: batch/v1
kind: Job
metadata:
  name: __JOB_NAME__
  namespace: __NAMESPACE__
  labels:
    app: prooftag-qr-e044
    prooftag.io/experiment: e044-multi-prompt-best-pipeline-v1
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: prooftag-qr-e044
        prooftag.io/experiment: e044-multi-prompt-best-pipeline-v1
    spec:
      restartPolicy: Never
      runtimeClassName: nvidia
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: e044
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          command: [python, -m, prooftag_qr.e044_multiprompt_best_pipeline]
          args:
            - --root
            - __RESULTS_ROOT__
            - --prompt-id
            - __PROMPT_ID__
            - --source-commit
            - __SOURCE_COMMIT__
          envFrom:
            - configMapRef:
                name: prooftag-qr-config
          env:
            - name: PROOFTAG_QR_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: prooftag-qr-database
                  key: password
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: prooftag-huggingface
                  key: token
                  optional: true
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: expandable_segments:True
            - name: CUBLAS_WORKSPACE_CONFIG
              value: :4096:8
          resources:
            requests:
              cpu: "2"
              memory: 12Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "12"
              memory: 32Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: model-cache
              mountPath: /cache
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: prooftag-qr-data
        - name: model-cache
          persistentVolumeClaim:
            claimName: prooftag-qr-model-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
