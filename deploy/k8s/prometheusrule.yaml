apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: prooftag-qr
  namespace: monitoring
  labels:
    release: kube-prometheus
    team: proofchat
spec:
  groups:
    - name: prooftag.qr
      interval: 30s
      rules:
        - alert: ProoftagQRServiceDown
          expr: absent(up{namespace="qr-core",service="prooftag-qr-svc"}) or max(up{namespace="qr-core",service="prooftag-qr-svc"}) == 0
          for: 5m
          labels:
            severity: critical
            service: prooftag-qr
            team: proofchat
          annotations:
            summary: Le générateur de QR Prooftag est indisponible
            description: Prometheus ne collecte plus le service prooftag-qr depuis cinq minutes.
        - alert: ProoftagQRHighRejectionRate
          expr: |
            sum(increase(prooftag_qr_runs_total{status="rejected"}[30m]))
            / clamp_min(sum(increase(prooftag_qr_runs_total[30m])), 1) > 0.10
            and sum(increase(prooftag_qr_runs_total[30m])) >= 5
          for: 10m
          labels:
            severity: warning
            service: prooftag-qr
            team: proofchat
          annotations:
            summary: Taux de rejet QR supérieur à 10 %
            description: Le pipeline rejette trop de générations après validation.
        - alert: ProoftagQRValidationFailureRate
          expr: |
            sum(increase(prooftag_qr_validations_total{outcome!="exact"}[30m]))
            / clamp_min(sum(increase(prooftag_qr_validations_total[30m])), 1) > 0.05
            and sum(increase(prooftag_qr_validations_total[30m])) >= 20
          for: 10m
          labels:
            severity: warning
            service: prooftag-qr
            team: proofchat
          annotations:
            summary: Échecs fréquents des scénarios de lecture QR
            description: Plus de 5 % des validations ne retournent pas exactement le payload attendu.
        - alert: ProoftagQRHighP95Latency
          expr: |
            histogram_quantile(0.95,
              sum by (le) (rate(prooftag_qr_duration_seconds_bucket{stage="total"}[30m]))) > 45
          for: 15m
          labels:
            severity: warning
            service: prooftag-qr
            team: proofchat
          annotations:
            summary: Latence P95 supérieure à 45 secondes
            description: La génération et sa validation dépassent l'objectif de latence.
        - alert: ProoftagQRError
          expr: increase(prooftag_qr_runs_total{status="error"}[15m]) > 0
          for: 1m
          labels:
            severity: critical
            service: prooftag-qr
            team: proofchat
          annotations:
            summary: Erreur dans le pipeline QR
            description: Au moins une génération s'est terminée en erreur au cours des quinze dernières minutes.
        - alert: ProoftagQRLatentRefinementError
          expr: increase(prooftag_qr_latent_refinements_total{outcome="error"}[15m]) > 0
          for: 1m
          labels:
            severity: warning
            service: prooftag-qr
            team: proofchat
          annotations:
            summary: Erreur du raffinement latent QR
            description: Le mode expérimental SRL a échoué ; les replis de production restent disponibles.
        - alert: ProoftagQRGuidedRediffusionError
          expr: increase(prooftag_qr_guided_rediffusions_total{outcome="error"}[15m]) > 0
          for: 1m
          labels:
            severity: warning
            service: prooftag-qr
            team: proofchat
          annotations:
            summary: Erreur de la seconde diffusion guidée
            description: L'étape expérimentale de rediffusion a échoué ; la chaîne brute de secours reste disponible.
        - alert: ProoftagQRLatentRefinementIneffective
          expr: |
            sum(increase(prooftag_qr_latent_refinements_total{outcome="no_improvement"}[30m]))
            / clamp_min(sum(increase(prooftag_qr_latent_refinements_total[30m])), 1) > 0.50
            and sum(increase(prooftag_qr_latent_refinements_total[30m])) >= 10
          for: 10m
          labels:
            severity: warning
            service: prooftag-qr
            team: proofchat
          annotations:
            summary: Raffinement latent inefficace
            description: Plus de la moitié des raffinements SRL n'améliorent pas l'erreur des modules.
        - alert: ProoftagQRSRPGError
          expr: increase(prooftag_qr_srpg_runs_total{outcome="error"}[15m]) > 0
          for: 1m
          labels:
            severity: warning
            service: prooftag-qr
            team: proofchat
          annotations:
            summary: Erreur de la boucle SRPG
            description: La boucle DDIM différentiable a échoué ; ses sorties ne doivent pas être interprétées comme valides.
        - alert: ProoftagQRSRPGIneffective
          expr: |
            sum(increase(prooftag_qr_srpg_runs_total{outcome=~"rejected_.*"}[2h]))
            / clamp_min(sum(increase(prooftag_qr_srpg_runs_total[2h])), 1) > 0.75
            and sum(increase(prooftag_qr_srpg_runs_total[2h])) >= 6
          for: 10m
          labels:
            severity: warning
            service: prooftag-qr
            team: proofchat
          annotations:
            summary: SRPG n'améliore pas l'erreur QR réelle
            description: Plus de 75 % des sorties SRPG échouent au garde-fou d'amélioration sur au moins six exécutions.
        - alert: ProoftagQRSRPGMemoryPressure
          expr: prooftag_qr_srpg_peak_gpu_memory_allocated_mib > 18432
          for: 1m
          labels:
            severity: warning
            service: prooftag-qr
            team: proofchat
          annotations:
            summary: SRPG approche la limite VRAM de la RTX 4000 Ada
            description: Le pic d'allocation PyTorch dépasse 18 Gio sur une carte de 20 Gio.
        - alert: ProoftagQRPostgresUnavailable
          expr: kube_statefulset_status_replicas_ready{namespace="qr-core",statefulset="prooftag-qr-postgres"} < 1
          for: 5m
          labels:
            severity: critical
            service: prooftag-qr-postgres
            team: proofchat
          annotations:
            summary: PostgreSQL du pipeline QR est indisponible
            description: Aucun réplica PostgreSQL n'est prêt depuis cinq minutes.
        - alert: ProoftagQRPostgresBackupOverdue
          expr: time() - kube_cronjob_status_last_successful_time{namespace="qr-core",cronjob="prooftag-qr-postgres-backup"} > 93600
          for: 15m
          labels:
            severity: warning
            service: prooftag-qr-postgres
            team: proofchat
          annotations:
            summary: Sauvegarde PostgreSQL QR en retard
            description: Aucune sauvegarde PostgreSQL n'a réussi depuis plus de 26 heures.
