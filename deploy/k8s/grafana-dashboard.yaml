apiVersion: v1
kind: ConfigMap
metadata:
  name: prooftag-qr-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    release: kube-prometheus
    team: proofchat
data:
  prooftag-qr.json: |-
    {
      "annotations": {"list": []},
      "editable": true,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "orange", "value": 95}, {"color": "green", "value": 99}]}, "unit": "percent"}},
          "gridPos": {"h": 5, "w": 4, "x": 0, "y": 0},
          "id": 1,
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}},
          "targets": [{"expr": "100 * sum(increase(prooftag_qr_runs_total{status=\"accepted\",backend=~\"$backend\"}[$__range])) / clamp_min(sum(increase(prooftag_qr_runs_total{backend=~\"$backend\"}[$__range])), 1)", "refId": "A"}],
          "title": "Taux d'acceptation",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "short"}},
          "gridPos": {"h": 5, "w": 4, "x": 4, "y": 0},
          "id": 2,
          "targets": [{"expr": "sum(increase(prooftag_qr_runs_total{backend=~\"$backend\"}[$__range]))", "refId": "A"}],
          "title": "Générations sur la période",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "s"}},
          "gridPos": {"h": 5, "w": 4, "x": 8, "y": 0},
          "id": 3,
          "targets": [{"expr": "histogram_quantile(0.95, sum by (le) (rate(prooftag_qr_duration_seconds_bucket{stage=\"total\",backend=~\"$backend\"}[30m])))", "refId": "A"}],
          "title": "Latence totale P95",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "percent"}},
          "gridPos": {"h": 5, "w": 4, "x": 12, "y": 0},
          "id": 4,
          "targets": [{"expr": "100 * avg(rate(prooftag_qr_scan_pass_rate_sum[30m]) / clamp_min(rate(prooftag_qr_scan_pass_rate_count[30m]), 0.000001))", "refId": "A"}],
          "title": "Score moyen de lecture",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "short"}},
          "gridPos": {"h": 5, "w": 4, "x": 16, "y": 0},
          "id": 5,
          "targets": [{"expr": "max(DCGM_FI_DEV_FB_USED)", "refId": "A"}],
          "title": "VRAM utilisée (MiB)",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "percent"}},
          "gridPos": {"h": 5, "w": 4, "x": 20, "y": 0},
          "id": 6,
          "targets": [{"expr": "max(DCGM_FI_DEV_GPU_UTIL)", "refId": "A"}],
          "title": "Utilisation GPU",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "ops"}},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 5},
          "id": 7,
          "targets": [
            {"expr": "sum by (status) (rate(prooftag_qr_runs_total{backend=~\"$backend\"}[5m]))", "legendFormat": "{{status}}", "refId": "A"}
          ],
          "title": "Débit par résultat",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "s"}},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 5},
          "id": 8,
          "targets": [
            {"expr": "histogram_quantile(0.50, sum by (le, stage) (rate(prooftag_qr_duration_seconds_bucket{backend=~\"$backend\"}[15m])))", "legendFormat": "P50 {{stage}}", "refId": "A"},
            {"expr": "histogram_quantile(0.95, sum by (le, stage) (rate(prooftag_qr_duration_seconds_bucket{backend=~\"$backend\"}[15m])))", "legendFormat": "P95 {{stage}}", "refId": "B"}
          ],
          "title": "Latence par étape",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "percentunit"}},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 13},
          "id": 9,
          "targets": [{"expr": "sum by (scenario, outcome) (increase(prooftag_qr_validations_total[$__range])) / on(scenario) group_left sum by (scenario) (increase(prooftag_qr_validations_total[$__range]))", "legendFormat": "{{scenario}} / {{outcome}}", "refId": "A"}],
          "title": "Résultats de validation par scénario",
          "type": "barchart"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {}},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 13},
          "id": 10,
          "targets": [
            {"expr": "max(DCGM_FI_DEV_GPU_UTIL)", "legendFormat": "GPU %", "refId": "A"},
            {"expr": "max(DCGM_FI_DEV_GPU_TEMP)", "legendFormat": "Température °C", "refId": "B"},
            {"expr": "max(DCGM_FI_DEV_POWER_USAGE)", "legendFormat": "Puissance W", "refId": "C"}
          ],
          "title": "GPU : charge, température et puissance",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {}},
          "gridPos": {"h": 7, "w": 8, "x": 0, "y": 21},
          "id": 11,
          "targets": [{"expr": "histogram_quantile(0.95, sum by (le, decoder) (rate(prooftag_qr_validation_duration_seconds_bucket[15m])))", "legendFormat": "{{decoder}}", "refId": "A"}],
          "title": "Latence P95 des décodeurs",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "percentunit"}},
          "gridPos": {"h": 7, "w": 8, "x": 8, "y": 21},
          "id": 12,
          "targets": [{"expr": "rate(prooftag_qr_module_error_rate_sum[30m]) / clamp_min(rate(prooftag_qr_module_error_rate_count[30m]), 0.000001)", "refId": "A"}],
          "title": "Taux moyen d'erreurs modules",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {}},
          "gridPos": {"h": 7, "w": 8, "x": 16, "y": 21},
          "id": 13,
          "targets": [{"expr": "prooftag_qr_runs_active", "refId": "A"}],
          "title": "Générations actives",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"mappings": [{"options": {"0": {"color": "red", "text": "Non chargé"}, "1": {"color": "green", "text": "Chargé"}}, "type": "value"}], "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}}},
          "gridPos": {"h": 6, "w": 6, "x": 0, "y": 28},
          "id": 14,
          "options": {"colorMode": "background", "reduceOptions": {"calcs": ["lastNotNull"]}},
          "targets": [{"expr": "max(prooftag_qr_model_loaded)", "refId": "A"}],
          "title": "Modèle ControlNet en mémoire",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "s"}},
          "gridPos": {"h": 6, "w": 9, "x": 6, "y": 28},
          "id": 15,
          "targets": [{"expr": "histogram_quantile(0.95, sum by (le, status) (rate(prooftag_qr_model_load_duration_seconds_bucket[$__rate_interval])))", "legendFormat": "P95 {{status}}", "refId": "A"}],
          "title": "Durée de chargement du modèle",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "short"}},
          "gridPos": {"h": 6, "w": 9, "x": 15, "y": 28},
          "id": 16,
          "targets": [{"expr": "sum by (status) (increase(prooftag_qr_model_loads_total[$__range]))", "legendFormat": "{{status}}", "refId": "A"}],
          "title": "Chargements du modèle par résultat",
          "type": "barchart"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "short"}},
          "gridPos": {"h": 7, "w": 12, "x": 0, "y": 34},
          "id": 17,
          "targets": [{"expr": "sum by (variant) (increase(prooftag_qr_repair_selected_total[$__range]))", "legendFormat": "{{variant}}", "refId": "A"}],
          "title": "Profils de réparation retenus",
          "type": "barchart"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "percentunit"}},
          "gridPos": {"h": 7, "w": 12, "x": 12, "y": 34},
          "id": 18,
          "targets": [{"expr": "sum by (variant) (increase(prooftag_qr_repair_variants_total{outcome=\"accepted\"}[$__range])) / clamp_min(sum by (variant) (increase(prooftag_qr_repair_variants_total[$__range])), 1)", "legendFormat": "{{variant}}", "refId": "A"}],
          "title": "Taux d'acceptation par profil de réparation",
          "type": "barchart"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["prooftag", "qr", "gpu"],
      "templating": {
        "list": [
          {
            "allValue": ".*",
            "current": {"text": "All", "value": "$__all"},
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "definition": "label_values(prooftag_qr_runs_total, backend)",
            "includeAll": true,
            "label": "Backend",
            "name": "backend",
            "query": {"query": "label_values(prooftag_qr_runs_total, backend)", "refId": "StandardVariableQuery"},
            "refresh": 1,
            "type": "query"
          }
        ]
      },
      "time": {"from": "now-24h", "to": "now"},
      "timezone": "browser",
      "title": "Prooftag — QR esthétique",
      "uid": "prooftag-qr",
      "version": 1
    }
