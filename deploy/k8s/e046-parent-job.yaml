apiVersion: batch/v1
kind: Job
metadata:
  name: __JOB_NAME__
  namespace: __NAMESPACE__
  labels:
    app: prooftag-qr-e046-parent
    app.kubernetes.io/name: prooftag-qr-e046-parent
    app.kubernetes.io/part-of: prooftag-qr
    prooftag.io/experiment: e046-controlled-best-generator-v1
    prooftag.io/task-kind: parent
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 21600
  template:
    metadata:
      labels:
        app: prooftag-qr-e046-parent
        prooftag.io/experiment: e046-controlled-best-generator-v1
        prooftag.io/task-kind: parent
    spec:
      restartPolicy: Never
      runtimeClassName: nvidia
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: e046
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - prooftag_qr.e046_campaign
            - generate-parent
          args:
            - --output-root
            - __OUTPUT_ROOT__
            - --plan-id
            - __PLAN_ID__
            - --candidate-id
            - __CANDIDATE_ID__
            - --source-commit
            - __SOURCE_COMMIT__
          envFrom:
            - configMapRef:
                name: prooftag-qr-config
          env:
            - name: PROOFTAG_QR_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: prooftag-qr-database
                  key: password
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: prooftag-huggingface
                  key: token
                  optional: true
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: expandable_segments:True
            - name: CUBLAS_WORKSPACE_CONFIG
              value: :4096:8
            - name: PROOFTAG_GIT_COMMIT
              value: __SOURCE_COMMIT__
            - name: PROOFTAG_RUNTIME_IMAGE
              value: __IMAGE__
            - name: PROOFTAG_RUNTIME_IMAGE_DIGEST
              value: __IMAGE_DIGEST__
            - name: PYTHONHASHSEED
              value: "0"
          resources:
            requests:
              cpu: "2"
              memory: 12Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "12"
              memory: 32Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: model-cache
              mountPath: /cache
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: prooftag-qr-data
        - name: model-cache
          persistentVolumeClaim:
            claimName: prooftag-qr-model-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
