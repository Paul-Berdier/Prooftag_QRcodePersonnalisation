apiVersion: batch/v1
kind: Job
metadata:
  name: __JOB_NAME__
  namespace: __NAMESPACE__
  labels:
    app: prooftag-qr-e035-parent-capture
    app.kubernetes.io/name: prooftag-qr-e035-parent-capture
    app.kubernetes.io/part-of: prooftag-qr
    prooftag.io/experiment: e035-parent-capture-from-e034-stage1-v1
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: prooftag-qr-e035-parent-capture
        prooftag.io/experiment: e035-parent-capture-from-e034-stage1-v1
    spec:
      restartPolicy: Never
      runtimeClassName: nvidia
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: capture
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          command: [python, -m, prooftag_qr.e035_parent_capture]
          args:
            - --stage1-image
            - __STAGE1_IMAGE__
            - --expected-stage1-image-sha256
            - __STAGE1_IMAGE_SHA256__
            - --expected-stage1-file-sha256
            - __STAGE1_FILE_SHA256__
            - --output-dir
            - __PARENT_DIR__
            - --audit-dir
            - __CAPTURE_AUDIT_DIR__
            - --source-commit
            - __SOURCE_COMMIT__
            - --source-plan
            - e035-parent-capture-from-e034-stage1-v1
            - --payload
            - https://ptag.io/t/e033
            - --prompt
            - a sunlit greenhouse filled with tomato plants and terracotta pots, botanical photograph
            - --negative-prompt
            - easynegative, low quality, worst quality, blurry, deformed, watermark, text, logo, oversaturated, clipped highlights, posterized colors
            - --seed
            - "51001"
          envFrom:
            - configMapRef:
                name: prooftag-qr-config
          env:
            - name: PROOFTAG_QR_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: prooftag-qr-database
                  key: password
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: prooftag-huggingface
                  key: token
                  optional: true
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: expandable_segments:True
          resources:
            requests:
              cpu: "2"
              memory: 12Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "12"
              memory: 32Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: model-cache
              mountPath: /cache
            - name: shared-memory
              mountPath: /dev/shm
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: prooftag-qr-data
        - name: model-cache
          persistentVolumeClaim:
            claimName: prooftag-qr-model-cache
        - name: shared-memory
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
